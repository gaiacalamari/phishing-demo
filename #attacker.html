<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Verifica sicurezza</title>
  <style>
    body { background:#f1f3f6; font-family:Arial,sans-serif; }
    .box {
      width:360px; margin:120px auto; background:#fff;
      padding:30px; border-radius:6px;
      box-shadow:0 6px 18px rgba(0,0,0,.15);
    }
    input, button {
      width:100%; padding:10px; margin-top:12px;
    }
    button { background:#0b5ed7; color:#fff; border:none; }
    .hidden { display:none; }
    .attacker {
      font-family:monospace;
      background:#111;
      color:#0f0;
      padding:20px;
      margin:40px auto;
      width:600px;
      border-radius:6px;
    }
  </style>
</head>
<body>

<div class="box" id="loginBox">
  <h2>Conferma identità</h2>
  <p>Per continuare, verifica le credenziali.</p>

  <form onsubmit="return fakeLogin();">
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Continua</button>
  </form>
</div>

<!-- Vista ATTACCANTE (nascosta) -->
<div class="attacker hidden" id="attackerView">
  <h3>[ Attacker View – Simulazione ]</h3>
  <pre id="dump"></pre>
</div>

<script>
function fakeLogin() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const timestamp = new Date().toISOString();

  /* ======= Console (vista invisibile all'utente) ======= */
  console.log("[PHISHING SIMULATO]");
  console.log("Email:", email);
  console.log("Password:", password);
  console.log("Timestamp:", timestamp);

  /* ======= Vista attaccante via hash URL ======= */
  if (window.location.hash === "#attacker") {
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("attackerView").classList.remove("hidden");

    document.getElementById("dump").textContent =
`Email: ${email}
Password: ${password}
Timestamp: ${timestamp}`;
  }

  return false;
}
</script>

</body>
</html>
