<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Verifica completata</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background: #f4f4f6;
      font-family: Arial, sans-serif;
      color: #323130;
    }

    .topbar {
      background: #0070ba; /* Colore blu PayPal */
      color: #ffffff;
      padding: 16px 32px;
      text-align: left;
      font-size: 18px;
      font-weight: 600;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 60px);
    }

    .card {
      background: #ffffff;
      width: 420px;
      padding: 40px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      border-radius: 8px;
      text-align: left;
    }

    h2 {
      font-weight: 600;
      margin-bottom: 16px;
      font-size: 24px;
    }

    p {
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 12px;
      color: #444;
    }

    .success {
      color: #107c10;
      font-weight: 600;
      margin-top: 20px;
    }

    .disclaimer {
      margin-top: 30px;
      font-size: 12px;
      color: #888;
      border-top: 1px solid #edebe9;
      padding-top: 12px;
      text-align: center;
    }

    footer {
      text-align: center;
      font-size: 12px;
      color: #888;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <img src="https://www.paypalobjects.com/webstatic/icon/pp258.png" alt="PayPal" width="120">
  </div>

  <div class="container">
    <div class="card">
      <h2>Verifica completata</h2>
      <p>
        Grazie. Il tuo account è stato verificato correttamente.
      </p>
      <p>
        Ora puoi continuare a utilizzare il servizio in modo sicuro.
      </p>

      <p class="success">
        ✔ Stato: Verifica riuscita
      </p>
    </div>
  </div>

  <footer>
    <p>© 2026 PayPal Inc. Tutti i diritti riservati.</p>
  </footer>

</body>
</html>
