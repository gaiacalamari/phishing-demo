<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Verifica account</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  background: #f3f2f1;
  font-family: "Segoe UI", Arial, sans-serif;
}

/* Vista utente */
.box {
  width: 380px;
  margin: 100px auto;
  background: #ffffff;
  padding: 32px;
  box-shadow: 0 2px 6px rgba(0,0,0,.2);
}

.logo {
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 20px;
}

h2 {
  font-size: 24px;
  font-weight: 600;
  margin: 0 0 10px;
}

p {
  color: #444;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 16px;
  font-size: 15px;
  box-sizing: border-box;
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 20px;
  background: #0067b8;
  color: #ffffff;
  border: none;
  font-size: 15px;
  cursor: pointer;
}

/* Vista didattica "attaccante" */
.attacker {
  width: 600px;
  margin: 60px auto;
  background: #111;
  color: #0f0;
  padding: 20px;
  font-family: monospace;
  border-radius: 6px;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<!-- VISTA UTENTE -->
<div class="box" id="loginBox">
  <div class="logo">Microsoft</div>

  <h2>Accedi</h2>
  <p>Per continuare è richiesta la verifica dell’account.</p>

  <form onsubmit="simulateAttack(); return false;">
    <input type="email" id="email" placeholder="Email, telefono o Skype" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Avanti</button>
  </form>
</div>

<script>
function simulateAttack() {
  const stolenData = {
    event: "credential_capture",
    email: document.getElementById("email").value,
    password: document.getElementById("password").value,
    timestamp: new Date().toISOString(),
    userAgent: navigator.userAgent,
    note: "Simulazione didattica - dati non inviati"
  };

  // Mostra vista "attaccante"
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("attackerView").classList.remove("hidden");

  document.getElementById("dump").textContent =
    JSON.stringify(stolenData, null, 2);

  // Reindirizzamento finale dell'utente
  setTimeout(() => {
    window.location.href = "verifica-completata.html"; 
  }, 3000);
}
</script>

</body>
</html>
