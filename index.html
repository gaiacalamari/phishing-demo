<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Verifica account</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin:0;
  background:#f3f2f1;
  font-family:"Segoe UI", Arial, sans-serif;
}

.box {
  width:380px;
  margin:100px auto;
  background:#fff;
  padding:32px;
  box-shadow:0 2px 6px rgba(0,0,0,.2);
}

.logo {
  font-size:20px;
  font-weight:600;
  margin-bottom:20px;
}

h2 {
  font-size:24px;
  font-weight:600;
  margin:0 0 10px;
}

p {
  color:#444;
  font-size:14px;
}

input {
  width:100%;
  padding:10px;
  margin-top:16px;
  font-size:15px;
}

button {
  width:100%;
  padding:10px;
  margin-top:20px;
  background:#0067b8;
  color:#fff;
  border:none;
  font-size:15px;
  cursor:pointer;
}

.notice {
  margin-top:20px;
  font-size:12px;
  color:#605e5c;
  background:#fff4ce;
  padding:10px;
  border-left:4px solid #ffb900;
}

/* Vista forense */
.attacker {
  width:600px;
  margin:60px auto;
  background:#111;
  color:#0f0;
  padding:20px;
  font-family:monospace;
  border-radius:6px;
}

.hidden { display:none; }
</style>
</head>

<body>

<!-- VISTA UTENTE -->
<div class="box" id="loginBox">
  <div class="logo">Microsoft</div>

  <h2>Accedi</h2>
  <p>Per continuare è richiesta la verifica dell’account.</p>

   <form action="verifica-completata.html">
    <input type="email" placeholder="Email, telefono o Skype" required>
    <input type="password" placeholder="Password" required>
    <button type="submit">Avanti</button>
  </form>
</div>

<!-- VISTA FORENSE / ANALISI -->
<div class="attacker hidden" id="attackerView">
  <h3>[ Forensic Training View ]</h3>
  <pre id="dump"></pre>
</div>

<script>
function simulatedLogin() {
  const eventLog = {
    event: "login_attempt",
    ui: "microsoft-style",
    timestamp: new Date().toISOString(),
    userAgent: navigator.userAgent,
    note: "No credentials captured (training mode)"
  };

  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("attackerView").classList.remove("hidden");

  document.getElementById("dump").textContent =
    JSON.stringify(eventLog, null, 2);

  return false;
}
</script>

</body>
</html>
